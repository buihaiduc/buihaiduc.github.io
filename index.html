<!doctype html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hóa học 12 · Phòng mô phỏng tương tác</title>
<style>
:root{
 --bg:#eef6f5;--bg2:#f8fbfb;--card:#ffffff;--card2:#f5f9f9;--ink:#10272d;--mut:#60757a;
 --line:#d5e3e3;--acc:#087f8c;--acc2:#0d9aa8;--good:#19764a;--warn:#a66a00;--bad:#b23b3b;
 --shadow:0 12px 34px rgba(19,55,60,.09);--r:18px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#09171b;--bg2:#0d1d22;--card:#12282e;--card2:#102229;--ink:#edf8f7;--mut:#9cb2b6;--line:#28454c;--acc:#55d6d0;--acc2:#7be4df;--good:#6ed69b;--warn:#f3bd67;--bad:#ff8888;--shadow:0 18px 45px rgba(0,0,0,.25)}
}
:root[data-theme="dark"]{--bg:#09171b;--bg2:#0d1d22;--card:#12282e;--card2:#102229;--ink:#edf8f7;--mut:#9cb2b6;--line:#28454c;--acc:#55d6d0;--acc2:#7be4df;--good:#6ed69b;--warn:#f3bd67;--bad:#ff8888;--shadow:0 18px 45px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--ink);font:400 16px/1.55 var(--font);min-height:100vh}
button,input,textarea,select{font:inherit}
button,a,[role=button]{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{border:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 75%,white);outline-offset:2px}
.shell{max-width:1500px;margin:auto;padding:0 clamp(14px,3vw,34px) 44px}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1500px;margin:auto;padding:11px clamp(14px,3vw,34px);display:flex;gap:12px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#4f63d8);display:grid;place-items:center;color:white;font-weight:900;box-shadow:var(--shadow);flex:0 0 auto}
.brandtext{min-width:0}.brandtext b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandtext span{display:block;color:var(--mut);font-size:12px}
.top-actions{margin-left:auto;display:flex;gap:7px;align-items:center}
.ibtn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;transition:.18s ease}
.ibtn{width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.ibtn:hover,.btn:hover{transform:translateY(-1px);border-color:var(--acc)}
.btn{padding:9px 13px;font-weight:750;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#062528}
:root[data-theme="light"] .btn.primary{color:white}
.btn.ghost{background:transparent}.btn.good{background:color-mix(in srgb,var(--good) 14%,var(--card));border-color:color-mix(in srgb,var(--good) 35%,var(--line));color:var(--good)}
main{padding-top:26px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:stretch}
.hero-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero-main{padding:clamp(22px,4vw,42px);position:relative;overflow:hidden}
.hero-main:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-90px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 26%,transparent),transparent 68%);pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:850}
h1{font-size:clamp(28px,4.7vw,52px);line-height:1.06;margin:8px 0 12px;letter-spacing:-.045em}
h2{line-height:1.18;letter-spacing:-.02em}
.lead{color:var(--mut);font-size:clamp(15px,1.7vw,18px);max-width:760px}
.searchbox{margin-top:22px;display:flex;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:15px;padding:7px}
.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);padding:8px 10px}
.stats{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:18px 14px;border-radius:15px;background:var(--card2);border:1px solid var(--line)}
.stat b{display:block;font-size:28px;line-height:1}.stat span{color:var(--mut);font-size:12px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h2{margin:0;font-size:22px}.section-head p{margin:0;color:var(--mut);font-size:13px}
.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chapter{position:relative;overflow:hidden;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.035);transition:.18s}
.chapter:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--cc)}
.chapter .n{font-weight:850;font-size:12px;color:var(--cc);text-transform:uppercase;letter-spacing:.06em}.chapter h3{margin:5px 0;font-size:17px}.chapter p{margin:0;color:var(--mut);font-size:13px}
.chapter:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.toolsrow{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 10px;border-radius:999px;color:var(--mut);font-size:13px;cursor:pointer}
.chip.active{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.notice{margin-top:18px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--warn) 8%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 28%,var(--line));color:var(--mut);font-size:13px}
.crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:14px}.crumb a{color:var(--acc);font-weight:750}
.list-title{display:flex;justify-content:space-between;gap:12px;align-items:start}
.list-title h1{font-size:clamp(27px,4vw,42px);margin:0}
.rxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px;margin-top:18px}
.rxcard{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;position:relative;transition:.18s}
.rxcard:hover{transform:translateY(-2px);border-color:var(--cc);box-shadow:var(--shadow)}
.rxcard h3{margin:3px 34px 7px 0;font-size:16px;line-height:1.3}.rxcard .eq{font-size:13px;color:var(--mut);min-height:41px}.rxcard .scene{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.star{position:absolute;right:10px;top:10px;width:31px;height:31px;border-radius:50%;background:transparent;color:var(--mut);cursor:pointer;font-size:18px}.star.on{color:#d69a00}
.sim-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:18px;align-items:start}
.lab{padding:14px}
.stage-toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--line);background:var(--card2);padding:3px;border-radius:11px}
.seg button{background:transparent;color:var(--mut);padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:750}
.seg button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stage{min-height:520px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 86%,#cdeef1),var(--card));display:grid;place-items:center;position:relative;overflow:hidden}
.stage canvas{display:block;width:min(100%,760px);height:auto;aspect-ratio:760/520}
.symbolic{width:100%;height:100%;min-height:520px;padding:clamp(22px,5vw,50px);display:none;align-content:center}
.symbolic.show{display:grid}.symbolic .formula{font-size:clamp(20px,3vw,33px);font-weight:850;line-height:1.45;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.symbolic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.symbolic-grid>div{padding:13px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px}.symbolic-grid b{display:block;color:var(--ink);margin-bottom:4px}
.controls{margin-top:12px;display:grid;grid-template-columns:auto auto minmax(130px,1fr) auto;gap:8px;align-items:center}
.controls input[type=range]{width:100%;accent-color:var(--acc)}
.speed{display:flex;gap:4px}.speed button{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}.speed button.active{border-color:var(--acc);color:var(--acc)}
.actionbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actionbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:13px}
.actionbar button.active{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.info{display:grid;gap:12px}
.info-card{padding:18px}.info-card h2{margin:0 0 8px;font-size:25px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.eqbox{padding:14px;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-weight:780;line-height:1.55}
.eqbox.hidden{filter:blur(7px);user-select:none}
.kv{display:grid;gap:10px;margin-top:13px}.kv>div{padding-top:10px;border-top:1px solid var(--line)}.kv b{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}.kv p{margin:0}
.inquiry{padding:16px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.step{padding:10px;border:1px solid var(--line);background:var(--card2);border-radius:12px;font-size:12px;color:var(--mut)}.step b{display:block;color:var(--ink)}
.notearea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;padding:10px}
.inquiry label{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:10px 0 4px}
.quest{margin-top:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 7%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 24%,var(--line));font-size:13px}
.navprev{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.navprev a{max-width:47%;color:var(--acc);font-weight:750;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;place-items:center;padding:18px}.modal.open{display:grid}.modalbox{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.modalhead h2{margin:0}.close{width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--ink);cursor:pointer}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.mapwrap svg{display:block;min-width:1100px;width:100%;height:auto}
.mapwrap text{font-family:var(--font);fill:var(--ink)}
.cn text{fill:#fff}.lf rect{fill:var(--card);stroke:var(--cc);stroke-width:2}.lf:hover rect{fill:var(--card2)}
.mobile-list{display:none}
.empty{padding:30px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.footer{margin-top:34px;color:var(--mut);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:#10272d;color:#fff;padding:9px 13px;border-radius:10px;font-size:13px;z-index:80;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1000px){
 .hero{grid-template-columns:1fr}.stats{grid-template-columns:repeat(4,1fr)}.chapters{grid-template-columns:repeat(2,1fr)}
 .sim-layout{grid-template-columns:1fr}.stage{min-height:460px}.symbolic{min-height:460px}
}
@media(max-width:700px){
 .brandtext span{display:none}.top-actions .wide{display:none}.hero-main{padding:23px}.stats{grid-template-columns:1fr 1fr}.chapters{grid-template-columns:1fr}
 .mapwrap{display:none}.mobile-list{display:grid;gap:9px}.mobile-list a{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
 .controls{grid-template-columns:1fr 1fr}.controls input[type=range]{grid-column:1/-1;grid-row:2}.speed{justify-content:flex-end}
 .steps{grid-template-columns:1fr}.symbolic-grid{grid-template-columns:1fr}.stage{min-height:390px}.symbolic{min-height:390px;padding:18px}
 .navprev{display:grid}.navprev a{max-width:none}.list-title{display:block}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{.topbar,.controls,.stage-toolbar,.actionbar,.navprev,.footer,.toast{display:none!important}.shell{max-width:none}.panel{box-shadow:none}.sim-layout{grid-template-columns:1fr}.stage{min-height:360px}}
</style>
</head>

function mapSVG(){

 const tot=s=>s.reduce((a,i)=>a+LS.filter(l=>l[0]===i).length*rh,0)+gp*(s.length-1),H=Math.max(tot(sides[0]),tot(sides[1]))+70;

 sides.forEach((s,si)=>{const d=si?-1:1;let y=(H-tot(s))/2;
  s.forEach(i=>{const ls=LS.filter(l=>l[0]===i),n=ls.length,cy=y+n*rh/2,col=CH[i][1],cx=mid+d*215,lx=d>0?mid+360:mid-360-lw;
   ln+=curve(mid+d*60,H/2,cx-d*cw/2,cy,col);

   ls.forEach((l,j)=>{const ly=y+(j+.5)*rh;ln+=curve(mid+d*320,cy,d>0?lx:lx+lw,ly,col);o+=`<a class="lf" href="#b${l[1]}" style="--cc:${col}"><rect x="${lx}" y="${ly-13}" width="${lw}" height="26" rx="8"/><text x="${lx+10}" y="${ly+4}" style="font-size:11.5px">${l[1]>30?"✦":`Bài ${l[1]}`} · ${esc(l[2])}</text></a>`});y+=n*rh+gp
  })
 });
 return`<svg viewBox="0 0 1400 ${H}" role="img" aria-label="Bản đồ chương trình Hóa học 12">${ln+o}</svg>`

function clear(){

 const g=ctx.createLinearGradient(0,0,0,520);g.addColorStop(0,getComputedStyle(root).getPropertyValue("--card2"));g.addColorStop(1,getComputedStyle(root).getPropertyValue("--card"));ctx.fillStyle=g;ctx.fillRect(0,0,760,520)
}
function txt(t,x,y,size=14,align="center",weight=700,color=null){ctx.fillStyle=color||getComputedStyle(root).getPropertyValue("--ink");ctx.font=`${weight} ${size}px ${getComputedStyle(root).getPropertyValue("--font")}`;ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(t,x,y)}
function glass(x,y,w,h,liquid,color){
 ctx.save();ctx.lineWidth=3;ctx.strokeStyle="rgba(60,90,98,.65)";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h-30);ctx.quadraticCurveTo(x,y+h,x+30,y+h);ctx.lineTo(x+w-30,y+h);ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-30);ctx.lineTo(x+w,y);ctx.stroke();
 if(liquid>0){ctx.fillStyle=color;ctx.globalAlpha=.88;ctx.fillRect(x+3,y+h*(1-liquid),w-6,h*liquid-4);ctx.globalAlpha=1}
 ctx.restore()
}
function bubbles(x,y,w,h,color="#fff",amount=.5){
 ctx.save();ctx.strokeStyle="rgba(0,0,0,.22)";ctx.fillStyle=color;
 for(let i=0;i<30;i++){const s=RAND[i];if(s[0]<amount){const yy=y+h-((sim.clock*(.018+s[1]*.025)+s[2]*h*2)%h),xx=x+8+s[1]*(w-16);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(xx,yy,2+s[2]*4,0,Math.PI*2);ctx.fill();ctx.stroke()}}ctx.restore()
}
function precip(x,y,w,h,color,amount,dissolve=false,color2=null){
 const a=dissolve?1-amount:amount;ctx.save();ctx.fillStyle=color2?mix(color,color2,amount):color;
 for(let i=0;i<70;i++){const s=RAND[i+35];if(s[0]<a){ctx.globalAlpha=.25+.7*s[1];ctx.beginPath();ctx.arc(x+8+s[1]*(w-16),y+h-7-s[2]*Math.min(52,h*.28),2.2+s[0]*2.6,0,7);ctx.fill()}}ctx.restore()
}
function flame(x,y,color="#ff9d2e",scale=1){
 const flick=1+(RM?0:.07*Math.sin(sim.clock/70));const g=ctx.createRadialGradient(x,y,2,x,y,42*scale);g.addColorStop(0,"#fff7b4");g.addColorStop(.45,color);g.addColorStop(1,"rgba(255,90,20,0)");ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,22*scale*flick,40*scale,0,0,7);ctx.fill()
}
function arrow(x1,y1,x2,y2,label,color="#188a96"){
 ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-10*Math.cos(a-.45),y2-10*Math.sin(a-.45));ctx.lineTo(x2-10*Math.cos(a+.45),y2-10*Math.sin(a+.45));ctx.closePath();ctx.fill();if(label)txt(label,(x1+x2)/2,(y1+y2)/2-13,12,"center",800,color)
}

function drawSolution(i){

 if(i===10){if(sim.variant==="heat")b="#efece0";else if(sim.variant==="cool")b="#2b1f6b"}
 if(i===46){a=sim.variant==="acid"?"#f3d33a":"#f08a24";b=sim.variant==="base"?"#f3d33a":"#f08a24"}

 if(c.p)precip(256,90+330*(1-.58),248,190,c.p,k,!!c.pd,c.p2);

 if(i===5&&k>.2){ctx.strokeStyle="#c9d0d6";ctx.lineWidth=7;ctx.globalAlpha=.8*k;ctx.strokeRect(253,93,254,323);ctx.globalAlpha=1;txt("Ag bám thành",380,125,12)}
 if(i===10){txt(sim.variant==="heat"?"Đun nóng → màu nhạt/mất":sim.variant==="cool"?"Để nguội → màu trở lại":"I₂ + hồ tinh bột",380,410,13)}

}

 let metal=c.s||"#bfc7cb",w=28,h=205*(c.sh?1-.65*k:1),x=360,y=120;ctx.fillStyle=metal;ctx.fillRect(x,y,w,h);
 if(c.c){ctx.fillStyle=c.c;ctx.globalAlpha=k;ctx.fillRect(x-2,y,32,h);ctx.globalAlpha=1}
 if(c.g)bubbles(320,215,150,190,i===48?Wh:c.g,Math.min(1,Math.sin(Math.PI*sim.progress)*1.7));

}

 const k=sim.circuit?smooth(sim.progress):0;
 txt(i===21?"Pin Daniell Zn – Cu":"Ăn mòn điện hóa Fe – Cu",380,48,18);
 glass(90,180,230,250,.58,i===21?mix("#dcecf0","#e9f2f3",k):"#e9f1df");glass(440,180,230,250,.58,i===21?"#5d9bdc":"#e9f1df");
 ctx.fillStyle=i===21?"#b9c0c8":Fe;ctx.fillRect(180,120,24,245);ctx.fillStyle=Cu;ctx.fillRect(555,120,24,245);
 txt(i===21?"Zn":"Fe",192,104,13);txt("Cu",567,104,13);
 ctx.strokeStyle="#344c54";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(192,120);ctx.lineTo(192,80);ctx.lineTo(567,80);ctx.lineTo(567,120);ctx.stroke();
 if(i===21){ctx.strokeStyle="#9f815f";ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(275,205);ctx.bezierCurveTo(330,120,430,120,485,205);ctx.stroke();txt("cầu muối",380,137,12)}
 ctx.fillStyle="var(--card)";ctx.strokeStyle="#344c54";ctx.lineWidth=3;ctx.beginPath();ctx.arc(380,80,34,0,7);ctx.fill();ctx.stroke();txt(i===21?"1,10 V":"H₂",380,80,13);
 if(sim.circuit&&sim.progress>0)arrow(230,62,530,62,"e⁻","#1c7f8b");
 if(i===21){ctx.globalAlpha=k;ctx.fillStyle=Cu;for(let j=0;j<18;j++){const s=RAND[j];ctx.beginPath();ctx.arc(555+(s[0]-.5)*28,210+s[1]*150,2+s[2]*3,0,7);ctx.fill()}ctx.globalAlpha=1;txt("anot (–)",192,452,12);txt("catot (+)",567,452,12)}
 else{bubbles(525,185,85,185,Wh,sim.circuit?.7:0);txt("Fe bị ăn mòn nhanh",192,452,12);txt("H₂ thoát trên Cu",567,452,12)}
}

 const k=sim.circuit?smooth(sim.progress):0;txt("Bình điện phân",380,48,18);
 glass(170,155,420,290,.64,i===22?mix("#5fbcb0","#a9dcd4",k):i===23?mix(C,Pk,k*.65):"#ffae54");
 ctx.fillStyle="#3b4650";ctx.fillRect(265,95,24,270);ctx.fillRect(470,95,24,270);txt("Catot (–)",277,77,13);txt("Anot (+)",482,77,13);
 ctx.strokeStyle="#344c54";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(277,95);ctx.lineTo(277,45);ctx.lineTo(483,45);ctx.lineTo(483,95);ctx.stroke();ctx.fillStyle="#344c54";ctx.fillRect(358,31,44,28);txt("DC",380,45,11,"center",800,"white");
 if(i===22){ctx.fillStyle=Cu;ctx.globalAlpha=k;ctx.fillRect(255,195,44,160);ctx.globalAlpha=1;bubbles(445,185,75,180,"#d4e157",k);txt("Cu bám",277,385,12);txt("Cl₂",482,385,12)}
 if(i===23){bubbles(240,185,80,180,Wh,k);bubbles(445,185,80,180,"#d4e157",k);txt("H₂",277,385,12);txt("Cl₂",482,385,12);txt("Gần catot môi trường trở nên kiềm",380,474,12)}
 if(i===24){ctx.fillStyle="#cdd2d8";ctx.globalAlpha=k;ctx.fillRect(205,385,350,45);ctx.globalAlpha=1;txt("Al(l) tích tụ ở đáy",380,472,12);ctx.globalAlpha=1-.32*k;ctx.fillStyle="#3b4650";ctx.fillRect(470,95,24,270);ctx.globalAlpha=1;txt("Anot C bị tiêu hao",482,385,12)}
}
function drawMolecular(i){
 const k=smooth(sim.progress);txt(SCENE_LABEL.molecular,380,52,18);
 if(i===2){for(let j=0;j<5;j++){const x=120+j*125;particle(x,210,"C=C","#f2c66f",22);if(k>.4)particle(x,310,"C–C","#d7e7c8",22)}arrow(150,255,610,255,"H₂ / Ni · t°");txt("Nối đôi C=C được hydrogen hóa",380,400,14)}
 else{const n=Math.round(3+k*7);for(let j=0;j<n;j++){const x=80+j*64,y=250+Math.sin(j*.9)*26;particle(x,y,i===20?"VC":"M","#d9e7ff",17);if(j<n-1){ctx.strokeStyle="#586b72";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+16,y);const y2=250+Math.sin((j+1)*.9)*26;ctx.lineTo(x+48,y2);ctx.stroke()}}txt(i===19?"Trùng ngưng: mạch dài hình thành và có phân tử nhỏ tách ra":"Trùng hợp: monomer nối thành mạch polymer",380,390,14)}

function drawSmoke(i){
 txt("Hai nguồn hơi khuếch tán",380,52,18);ctx.strokeStyle="#8a694b";ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(120,390);ctx.lineTo(300,280);ctx.moveTo(640,390);ctx.lineTo(460,280);ctx.stroke();
 const k=smooth(sim.progress);for(let j=0;j<70;j++){const s=RAND[j],cx=380+(s[0]-.5)*210*(1-k*.45),cy=260+(s[1]-.5)*130;ctx.fillStyle="rgba(225,235,238,.68)";ctx.globalAlpha=k*(.35+.55*s[2]);ctx.beginPath();ctx.arc(cx,cy,6+s[1]*15,0,7);ctx.fill()}ctx.globalAlpha=1;txt("Vùng khói trắng hình thành nơi hai hơi gặp nhau",380,430,13)
}
function drawHeat(i){
 const k=smooth(sim.progress);txt(i===32?"Phản ứng nhiệt nhôm":i===29?"Magnesium cháy":i===30?"Sắt cháy trong chlorine":i===31?"Khử oxide sắt bằng CO":"Nhiệt phân",380,52,18);
 ctx.fillStyle="#58656a";ctx.fillRect(250,355,260,18);ctx.fillStyle=R[i][3].s||"#eee";ctx.beginPath();ctx.ellipse(380,335,95,30,0,0,7);ctx.fill();
 if(sim.progress>0&&sim.progress<1)flame(380,300,R[i][3].f||"#ff9d2e",i===32?1.8:1.2);
 if(i===32&&k>.55){ctx.fillStyle="#ff7a2a";ctx.globalAlpha=k;ctx.beginPath();ctx.ellipse(380,350,80,24,0,0,7);ctx.fill();ctx.globalAlpha=1;txt("Sắt nóng chảy",380,410,13)}
 if(i===29&&k>.3){ctx.fillStyle="rgba(255,255,230,.9)";ctx.globalAlpha=k;ctx.fillRect(355,320,50,18);ctx.globalAlpha=1;txt("Ánh sáng trắng chói (minh họa)",380,410,13)}
 if(i===30&&k>.3){ctx.fillStyle="rgba(160,74,28,.28)";for(let j=0;j<25;j++){const s=RAND[j];ctx.beginPath();ctx.arc(380+(s[0]-.5)*160,275-s[1]*120,8+s[2]*15,0,7);ctx.fill()}txt("Khói sản phẩm",380,410,13)}
 if(i===31)txt("Fe₂O₃ → Fe khi bị CO khử ở nhiệt độ cao",380,410,13);
 if(i===36){bubbles(325,215,110,120,"#d5dde0",k);txt("CO₂ và hơi nước thoát ra",380,410,13)}
}
function drawCave(i){
 const k=smooth(sim.progress);txt("Mô hình hang động – thạch nhũ",380,44,18);
 ctx.fillStyle="#856f5b";ctx.beginPath();ctx.moveTo(0,100);ctx.lineTo(760,100);ctx.lineTo(760,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
 ctx.fillStyle="#6b584a";ctx.beginPath();ctx.moveTo(0,420);ctx.quadraticCurveTo(180,360,330,430);ctx.quadraticCurveTo(520,350,760,420);ctx.lineTo(760,520);ctx.lineTo(0,520);ctx.closePath();ctx.fill();
 ctx.fillStyle="#d5c7a8";for(let j=0;j<12;j++){const x=70+j*58,h=35+RAND[j][0]*120*k;ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x-10,100+h);ctx.lineTo(x+10,100+h);ctx.fill()}
 for(let j=0;j<9;j++){const x=100+j*72,h=20+RAND[j+30][1]*90*k;ctx.beginPath();ctx.moveTo(x,420);ctx.lineTo(x-10,420-h);ctx.lineTo(x+10,420-h);ctx.fill()}
 ctx.fillStyle="#8ad6e5";for(let j=0;j<12;j++){const s=RAND[j+70];ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(70+s[0]*620,125+s[1]*240,2.5,0,7);ctx.fill()}ctx.globalAlpha=1;txt("Nước giàu CO₂ hòa tan CaCO₃; khi CO₂ thoát ra, CaCO₃ lắng lại",380,475,12)
}
function drawFoam(i){
 const k=smooth(sim.progress);txt("Phản ứng phân hủy H₂O₂ – bọt khí",380,45,18);glass(295,145,170,300,.58,"#f4e3b0");
 for(let j=0;j<100;j++){const s=RAND[j],yy=390-s[0]*330*k,xx=380+(s[1]-.5)*(125+70*k);if(s[0]<k){ctx.fillStyle=s[2]>.82?"#f28ca0":"#fff";ctx.strokeStyle="rgba(70,100,110,.35)";ctx.beginPath();ctx.arc(xx,yy,7+s[2]*11,0,7);ctx.fill();ctx.stroke()}}txt("O₂ tạo ra nhanh làm hệ bọt nở mạnh",380,470,13)
}
function drawMicro(i,s){
 txt("Mức vi mô · mô hình hạt",380,38,17);const k=smooth(sim.progress);
 if(s==="electrochem"||s==="electrolysis"){
  for(let j=0;j<18;j++){const ss=RAND[j],x=80+ss[0]*600,y=150+ss[1]*270;particle(x,y,j%3===0?"e⁻":j%2?"cation":"anion",j%3===0?"#f4d35e":j%2?"#90caf9":"#ef9a9a",13)}
  arrow(180,85,580,85,"dòng e⁻ (mạch ngoài)");txt("Ion di chuyển trong chất điện li để cân bằng điện tích",380,465,13);return
 }
 if(s==="molecular")return drawMolecular(i);
 if(s==="cave"){for(let j=0;j<26;j++){const ss=RAND[j];particle(80+ss[0]*600,150+ss[1]*250,j%3===0?"Ca²⁺":j%3===1?"HCO₃⁻":"CO₂",j%3===0?"#a7c7ff":j%3===1?"#f0df9a":"#c5e8e8",13)}txt("Các cân bằng hòa tan – kết tủa quyết định sự hình thành CaCO₃",380,465,13);return}
 const c=R[i][3],prec=!!c.p,gas=!!c.g;
 for(let j=0;j<35;j++){const ss=RAND[j],x=70+ss[0]*620,y=120+ss[1]*320;let lab=j%2?"A":"B",col=j%2?"#8fd3e8":"#f2c47b";
  let xx=x,yy=y;if(prec&&k>.25&&j<18){xx=270+(j%6)*44;yy=390-Math.floor(j/6)*28;lab="↓";col=c.p||"#ddd"}if(gas&&k>.2&&j<12){yy=350-((sim.clock*.025+ss[0]*260)%280);lab="↑";col="#dceef2"}
  particle(xx,yy,lab,col,12)
 }
 txt(prec?"Các hạt sản phẩm ít tan tập hợp thành pha rắn":gas?"Phân tử khí tách khỏi dung dịch và thoát lên":"Sự sắp xếp/loại hạt thay đổi khi phản ứng diễn ra",380,470,13)
}
function smooth(x){return x*x*(3-2*x)}

/* ===== Vòng lặp chuẩn: pause dừng cả tiến trình lẫn chuyển động ===== */
function loop(now){
 const dt=Math.min(80,now-(sim.last||now));sim.last=now;
 if(current.index!=null&&ctx){
  if(sim.playing){sim.clock+=dt*sim.speed;sim.progress=Math.min(1,sim.progress+dt*sim.speed/7000);if(sim.progress>=1){sim.playing=false;completed.add(current.index);saveSets();syncPlay()};const sl=$("#timeline");if(sl)sl.value=Math.round(sim.progress*1000)}
  if(sim.mode!=="symbolic")draw()
 }
 requestAnimationFrame(loop)
}

/* ===== Modal, theme, route ===== */
function openModal(html){$("#modalBox").innerHTML=html;$("#modal").classList.add("open");$("#modalBox .close")?.focus()}
function closeModal(){$("#modal").classList.remove("open")}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
$("#themeBtn").onclick=()=>{const cur=root.dataset.theme||"auto",next=cur==="auto"?"dark":cur==="dark"?"light":"auto";root.dataset.theme=next;store.set("theme",next);toast(next==="auto"?"Theo hệ thống":next==="dark"?"Giao diện tối":"Giao diện sáng");draw()};
root.dataset.theme=store.get("theme","auto");
$("#helpBtn").onclick=()=>openModal(`<div class="modalhead"><h2>Hướng dẫn sử dụng</h2><button class="close" onclick="closeModal()">×</button></div><p><b>Vĩ mô</b>: quan sát hiện tượng. <b>Vi mô</b>: xem hạt/ion/electron. <b>Kí hiệu</b>: phương trình và bán phản ứng.</p><p>Quy trình gợi ý: <b>Dự đoán → Chạy mô phỏng → Quan sát → Chuyển sang mức vi mô → Giải thích → Lưu sổ tay</b>.</p><p>Phím tắt khi đang mô phỏng: <b>Space</b> chạy/tạm dừng, <b>R</b> làm lại, <b>1/2/3</b> chuyển mức biểu diễn.</p><div class="notice">Đây là công cụ học tập định tính, không phải hướng dẫn tự tiến hành các phản ứng hóa học ngoài phòng thí nghiệm.</div>`);
$("#favBtn").onclick=()=>{location.hash="";setTimeout(()=>{$("#showFav")?.click()},50)};
addEventListener("keydown",e=>{if(["TEXTAREA","INPUT"].includes(document.activeElement?.tagName))return;if(current.index==null)return;if(e.code==="Space"){e.preventDefault();$("#playBtn")?.click()}if(e.key.toLowerCase()==="r")$("#resetBtn")?.click();if(["1","2","3"].includes(e.key))$$("[data-mode]")[+e.key-1]?.click()});
function specialList(){
 current={route:"special",index:null,item:null,scene:null};const ids=chRx(8);app.innerHTML=`<div class="crumb"><a href="#">Trang chủ</a><span>›</span>Hiện tượng đặc biệt</div><div class="eyebrow">Mở rộng</div><h1 style="font-size:40px">Hiện tượng đặc biệt</h1><p class="lead">Các hiện tượng cần scene riêng để tránh ép vào mô hình ống nghiệm chung.</p><div class="rxgrid">${ids.map(i=>rxCard(i,"#0b8a96","special")).join("")}</div>`;bindStars()
}
function route(){
 window.scrollTo(0,0);sim.playing=false;ctx=null;canvas=null;
 const h=location.hash.slice(1);if(!h)return home();
 if(h==="special")return specialList();
 const m=h.match(/^(.*)-r(\d+)$/);if(m)return simView(m[1],+m[2]);
 if(h.startsWith("c")||h.startsWith("b"))return listView(h);
 home()
}
addEventListener("hashchange",route);route();requestAnimationFrame(loop);
</script>
